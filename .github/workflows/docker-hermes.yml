name: Docker Hermes-Agent

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Build the Docker image
        run: |
          docker version
          # 登录阿里云镜像仓库
          docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }} registry.cn-shanghai.aliyuncs.com
          # 使用Dockerfile构建镜像
          docker pull nousresearch/hermes-agent:v2026.7.1
          docker tag nousresearch/hermes-agent:v2026.7.1  registry.cn-shanghai.aliyuncs.com/yydd/hermes-agent:v2026.7.1
          # 推送镜像到镜像仓库
          docker push registry.cn-shanghai.aliyuncs.com/yydd/hermes-agent:v2026.7.1
